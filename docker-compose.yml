name: loanflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: loanflow
      POSTGRES_PASSWORD: loanflow
      POSTGRES_DB: loanflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanflow -d loanflow"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    volumes:
      - ./services/application-api/migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://loanflow:loanflow@postgres:5432/loanflow?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
